<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <!-- Add your devotional content here -->
        <table>
        <tr id = "tim">

          <th>Speaker</th>
          <th>Title</th>
          <th>Location</th>
          <th>Year</th>
        </tr>
        <tr>
          <td>Rob Garrett</td>
          <td>He will make more of you</td>
          <td>BYUI</td>
          <td>2026</td>
        </tr>
        <tr>
          <td>Alvin F. Meredith III</td>
          <td>The Mission of BYU Idaho</td>
          <td>BYUI</td>
          <td>2026</td>
        </tr>
        <tr>
          <td>James O. Fantone</td>
          <td>The Battle Is the Lord's</td>
          <td>BYUI</td>
          <td>2026</td>
        </tr>
        </table>
        <form>
          <label for ="speaker_name">Speaker: </label>
          <input type = "text" id = "speaker_name">


          <label for ="title">Title: </label>
          <input type = "text" id = "title">


          <label for ="location">location: </label>
          <input type = "text" id = "location">


          <label for ="year">year: </label>
          <input type = "text" id = "year">

          <input type = "submit" value = "submit">
        </form>
      </div>
    </main>
  </div>
</body>
</html>
